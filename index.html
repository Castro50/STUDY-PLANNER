<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Planner | Cavendish University</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .planner-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }

        h1 {
            font-size: 2rem;
            color: #333;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .add-task-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .btn-add {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }

        .filter-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #e0e0e0;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 500;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .tasks-list {
            list-style: none;
            max-height: 500px;
            overflow-y: auto;
        }

        .task-item {
            background: white;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .task-check {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .task-details {
            flex: 1;
        }

        .task-name {
            font-weight: 600;
            font-size: 16px;
        }

        .task-meta {
            display: flex;
            gap: 15px;
            margin-top: 5px;
            font-size: 12px;
            color: #888;
        }

        .task-subject {
            background: #e8f4f8;
            padding: 2px 10px;
            border-radius: 12px;
        }

        .completed .task-name {
            text-decoration: line-through;
            color: #999;
        }

        .delete-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #cc0000;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: white;
            font-size: 12px;
        }

        @media (max-width: 600px) {
            .planner-card {
                padding: 15px;
            }
            .task-item {
                flex-direction: column;
                gap: 10px;
            }
            .delete-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="planner-card">
            <h1>🎓 Study Planner</h1>
            <div class="subtitle">Organize your studies • Never miss a deadline</div>

            <div class="add-task-section">
                <div class="form-group">
                    <label>Task Name</label>
                    <input type="text" id="taskName" placeholder="e.g., Complete Web Programming assignment">
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="subject" placeholder="e.g., Internet & Web Programming">
                </div>
                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="dueDate">
                </div>
                <button class="btn-add" id="addBtn">➕ Add Study Task</button>
            </div>

            <div class="filter-buttons">
                <button class="filter-btn active" id="filterAll">All Tasks</button>
                <button class="filter-btn" id="filterPending">Pending</button>
                <button class="filter-btn" id="filterCompleted">Completed</button>
            </div>

            <ul class="tasks-list" id="tasksList">
                <li class="empty-state">✨ No tasks yet. Add your first study task above! ✨</li>
            </ul>
        </div>
        <footer>
            Study Planner - Castro50 - Cavendish University Uganda
        </footer>
    </div>

    <script>
        // Get all elements
        const taskNameInput = document.getElementById('taskName');
        const subjectInput = document.getElementById('subject');
        const dueDateInput = document.getElementById('dueDate');
        const addBtn = document.getElementById('addBtn');
        const tasksList = document.getElementById('tasksList');
        const filterAllBtn = document.getElementById('filterAll');
        const filterPendingBtn = document.getElementById('filterPending');
        const filterCompletedBtn = document.getElementById('filterCompleted');

        // Data
        let tasks = [];
        let currentFilter = 'all';

        // Load tasks from localStorage
        function loadTasks() {
            const saved = localStorage.getItem('studyPlannerTasks');
            if (saved) {
                tasks = JSON.parse(saved);
            } else {
                tasks = [
                    { id: 1, name: 'Complete HTML/CSS layout', subject: 'Web Programming', dueDate: '2026-05-20', completed: false },
                    { id: 2, name: 'Write exam report', subject: 'Project', dueDate: '2026-05-18', completed: true },
                    { id: 3, name: 'Practice responsive design', subject: 'Frontend', dueDate: '2026-05-22', completed: false }
                ];
            }
            displayTasks();
        }

        // Save tasks to localStorage
        function saveTasks() {
            localStorage.setItem('studyPlannerTasks', JSON.stringify(tasks));
        }

        // Add new task
        function addTask() {
            const name = taskNameInput.value.trim();
            const subject = subjectInput.value.trim();
            const dueDate = dueDateInput.value;

            if (name === '') {
                alert('Please enter a task name');
                return;
            }

            const newTask = {
                id: Date.now(),
                name: name,
                subject: subject || 'General',
                dueDate: dueDate || 'No date set',
                completed: false
            };

            tasks.unshift(newTask);
            saveTasks();
            displayTasks();

            // Clear inputs
            taskNameInput.value = '';
            subjectInput.value = '';
            dueDateInput.value = '';
        }

        // Toggle completion
        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                saveTasks();
                displayTasks();
            }
        }

        // Delete task
        function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasks();
                displayTasks();
            }
        }

        // Display tasks
        function displayTasks() {
            let filteredTasks = tasks;
            
            if (currentFilter === 'pending') {
                filteredTasks = tasks.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filteredTasks = tasks.filter(t => t.completed);
            }

            if (filteredTasks.length === 0) {
                tasksList.innerHTML = '<li class="empty-state">📭 No tasks to display 📭</li>';
                return;
            }

            tasksList.innerHTML = '';
            for (let i = 0; i < filteredTasks.length; i++) {
                const task = filteredTasks[i];
                const li = document.createElement('li');
                li.className = 'task-item';
                if (task.completed) {
                    li.classList.add('completed');
                }
                
                li.innerHTML = `
                    <div class="task-info">
                        <input type="checkbox" class="task-check" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
                        <div class="task-details">
                            <div class="task-name">${task.name}</div>
                            <div class="task-meta">
                                <span class="task-subject">📖 ${task.subject}</span>
                                <span>📅 ${task.dueDate}</span>
                            </div>
                        </div>
                    </div>
                    <button class="delete-btn" onclick="deleteTask(${task.id})">Delete</button>
                `;
                tasksList.appendChild(li);
            }
        }

        // Filter functions
        function filterAll() {
            currentFilter = 'all';
            updateButtons('all');
            displayTasks();
        }

        function filterPending() {
            currentFilter = 'pending';
            updateButtons('pending');
            displayTasks();
        }

        function filterCompleted() {
            currentFilter = 'completed';
            updateButtons('completed');
            displayTasks();
        }

        function updateButtons(filter) {
            filterAllBtn.classList.remove('active');
            filterPendingBtn.classList.remove('active');
            filterCompletedBtn.classList.remove('active');
            
            if (filter === 'all') filterAllBtn.classList.add('active');
            if (filter === 'pending') filterPendingBtn.classList.add('active');
            if (filter === 'completed') filterCompletedBtn.classList.add('active');
        }

        // Set up event listeners
        addBtn.addEventListener('click', addTask);
        filterAllBtn.addEventListener('click', filterAll);
        filterPendingBtn.addEventListener('click', filterPending);
        filterCompletedBtn.addEventListener('click', filterCompleted);
        
        taskNameInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // Set default due date to tomorrow
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        dueDateInput.value = tomorrow.toISOString().split('T')[0];

        // Start the app
        loadTasks();
    </script>
</body>
</html>
